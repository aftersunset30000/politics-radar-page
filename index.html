<title>정치뉴스 레이더</title>
<style>
  :root {
    --bg: #f5f4f1;
    --surface: #ffffff;
    --surface-2: #efede8;
    --line: #e2dfd8;
    --text: #1c1b19;
    --muted: #6f6b63;
    --faint: #9a958c;
    --accent: #d6361f;
    --accent-soft: #fbe6e2;
    --mbc: #2457d6;
    --mbc-soft: #e3eafb;
    --jtbc: #c2560b;
    --jtbc-soft: #fbeadc;
    --knn: #0a7a63;
    --knn-soft: #dcf0ea;
    --obs: #6a4bc4;
    --obs-soft: #e9e3fa;
    --bar: #e9e6df;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151514; --surface: #1e1d1b; --surface-2: #282724; --line: #33312d;
      --text: #efece6; --muted: #a8a399; --faint: #7a766e;
      --accent: #ff6a4d; --accent-soft: #3a211b;
      --mbc: #7fa2ff; --mbc-soft: #1f2a45; --jtbc: #f59a52; --jtbc-soft: #3a2717;
      --knn: #5ccbb0; --knn-soft: #15332c;
      --obs: #b3a0ff; --obs-soft: #292040;
      --bar: #2c2a27; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151514; --surface: #1e1d1b; --surface-2: #282724; --line: #33312d;
    --text: #efece6; --muted: #a8a399; --faint: #7a766e;
    --accent: #ff6a4d; --accent-soft: #3a211b;
    --mbc: #7fa2ff; --mbc-soft: #1f2a45; --jtbc: #f59a52; --jtbc-soft: #3a2717;
    --knn: #5ccbb0; --knn-soft: #15332c;
    --obs: #b3a0ff; --obs-soft: #292040;
    --bar: #2c2a27; --shadow: none;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; }
  .num { font-variant-numeric: tabular-nums; }

  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
  h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
  .pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); position: relative; }
  .pulse::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; animation: ping 2.4s ease-out infinite; }
  @keyframes ping { 0% { transform: scale(.4); opacity: .7; } 100% { transform: scale(1.3); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pulse::after { animation: none; } }
  .rule { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .rule b { color: var(--text); font-weight: 600; }
  .updated { text-align: right; color: var(--muted); font-size: 12px; }
  .updated strong { display: block; color: var(--text); font-size: 14px; font-weight: 600; }

  .stale { margin-top: 16px; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 13px; }
  .stale code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 22px 0 18px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
  .stat .label { color: var(--muted); font-size: 12px; }
  .stat .value { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; }
  .stat .sub { color: var(--faint); font-size: 11px; }
  @media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 400px) { .stats { grid-template-columns: minmax(0, 1fr); } }

  .controls { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 8px 0; margin-bottom: 4px; display: flex; flex-direction: column; gap: 8px; }
  .ctl-row { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
  .ctl-label { color: var(--muted); font-size: 12px; font-weight: 600; }
  .seg { display: inline-flex; flex-wrap: wrap; background: var(--surface-2); border-radius: 9px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 7px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
  #f-vph button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  select, input[type="search"] { font: inherit; font-size: 13px; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; }
  input[type="search"] { flex: 1 1 160px; min-width: 0; }
  label.check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; user-select: none; }
  .count { color: var(--muted); font-size: 12px; margin: 0 0 8px; }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .row { display: grid; grid-template-columns: 34px 168px minmax(0, 1fr) 150px; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px 10px 10px; box-shadow: var(--shadow); }
  .row.off { opacity: .55; }
  .rank { text-align: center; font-size: 15px; font-weight: 700; color: var(--faint); }
  .row:nth-child(-n+3) .rank { color: var(--accent); }
  .thumb { position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: var(--surface-2); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .dur { position: absolute; right: 5px; bottom: 5px; background: rgba(0,0,0,.78); color: #fff; font-size: 11px; padding: 1px 5px; border-radius: 4px; }
  .body { min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; }
  .badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 5px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .badge.mbc { background: var(--mbc-soft); color: var(--mbc); }
  .badge.jtbc { background: var(--jtbc-soft); color: var(--jtbc); }
  .badge.knn { background: var(--knn-soft); color: var(--knn); }
  .badge.obs { background: var(--obs-soft); color: var(--obs); }
  .badge.live { background: var(--accent); color: #fff; }
  .badge.topic { background: transparent; border: 1px solid var(--line); color: var(--text); font-weight: 500; }
  .badge.no { background: transparent; border: 1px dashed var(--line); color: var(--faint); font-weight: 500; }
  .title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--text); text-decoration: none; font-size: 15px; font-weight: 600; line-height: 1.4; letter-spacing: -0.01em; }
  .title:hover { text-decoration: underline; text-underline-offset: 3px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .rate { text-align: right; }
  .rate .v { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .rate .u { font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 2px; }
  .rate .total { font-size: 12px; color: var(--muted); }
  .meter { height: 4px; border-radius: 2px; background: var(--bar); margin: 6px 0 5px; overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }

  @media (max-width: 760px) {
    .row { grid-template-columns: 120px minmax(0, 1fr); grid-template-areas: "thumb body" "rate rate"; gap: 10px 12px; padding: 10px; }
    .rank { display: none; }
    .thumb { grid-area: thumb; }
    .body { grid-area: body; }
    .rate { grid-area: rate; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; text-align: left; border-top: 1px solid var(--line); padding-top: 8px; }
    .rate .meter { margin: 0; }
    .title { font-size: 14px; }
  }

  .more { text-align: center; margin-top: 14px; }
  .more button { font: inherit; font-size: 13px; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 8px 18px; cursor: pointer; }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
  .empty code { font-family: ui-monospace, Menlo, monospace; background: var(--surface-2); padding: 2px 6px; border-radius: 5px; color: var(--text); }
  footer { margin-top: 26px; color: var(--faint); font-size: 12px; line-height: 1.7; }
  footer code { font-family: ui-monospace, Menlo, monospace; }
</style>
</head>

  // 자동 새로고침 뒤에도 고른 필터·검색어를 유지한다
  const SAVED = 'radar-state', SCROLL = 'radar-scroll';
  try { Object.assign(state, JSON.parse(sessionStorage.getItem(SAVED) || '{}'), { limit: PAGE }); } catch (e) {}
  $('f-sort').value = state.sort;
  $('f-q').value = state.q;
  $('f-all').checked = state.all;

  const seg = (el, key, opts) => {
    el.innerHTML = opts.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${state[key] === v}">${esc(l)}</button>`).join('');
    el.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      state[key] = b.dataset.v;
      el.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
      update();
    });
  };
  seg($('f-vph'), 'vph', [['0', '전체'], ...filters.map(n => [String(n), `${fmt(n)}+`])]);
  seg($('f-channel'), 'channel', [['all', '전체'], ...D.channels.map(c => [c.key, c.name])]);
  seg($('f-kind'), 'kind', [['all', '전체'], ['video', '영상'], ['short', '쇼츠'], ['live', '라이브']]);
  $('f-sort').addEventListener('change', e => { state.sort = e.target.value; update(); });
  $('f-q').addEventListener('input', e => { state.q = e.target.value; update(); });
  $('f-all').addEventListener('change', e => { state.all = e.target.checked; update(); });
  $('more-btn').addEventListener('click', () => { state.limit += PAGE; renderList(); });

  let rows = [];

  function update() {
    state.limit = PAGE;
    try { sessionStorage.setItem(SAVED, JSON.stringify(state)); } catch (e) {}
    renderStats();
    renderList();
  }

  function renderStats() {
    const min = Number(state.vph);
    const pol = D.videos.filter(v => v.politics && v.vph >= min).sort((a, b) => b.vph - a.vph);
    const label = min ? `시간당 ${fmt(min)}+` : '전체';
    const stat = (name, value, sub) => `<div class="stat"><div class="label">${name}</div><div class="value num">${value}</div><div class="sub">${sub}</div></div>`;
    $('stats').innerHTML = [
      stat(`국내정치 · ${label}`, fmt(pol.length), `전체 영상 ${fmt(D.videos.length)}개 중`),
      ...D.channels.map(c => {
        const mine = pol.filter(v => v.channel === c.key);
        return stat(esc(c.name), fmt(mine.length), mine.length ? `최고 ${short(mine[0].vph)}/시간` : '해당 없음');
      }),
      stat('최고 시간당 조회수', pol[0] ? short(pol[0].vph) : '–', pol[0] ? esc(chName[pol[0].channel]) : '해당 없음'),
    ].join('');
  }

  function renderList() {
    const min = Number(state.vph);
    const terms = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    rows = D.videos.filter(v =>
      v.vph >= min &&
      (state.all || v.politics) &&
      (state.channel === 'all' || v.channel === state.channel) &&
      (state.kind === 'all' || v.kind === state.kind) &&
      terms.every(t => v.title.toLowerCase().includes(t)));
    const by = { vph: (a, b) => b.vph - a.vph, views: (a, b) => b.views - a.views, recent: (a, b) => a.age_h - b.age_h };
    rows.sort(by[state.sort]);

    $('count').textContent = `${fmt(rows.length)}개 영상${rows.length > state.limit ? ` · 상위 ${fmt(state.limit)}개 표시` : ''}`;
    if (!rows.length) {
      $('list').innerHTML = `<div class="empty">조건에 맞는 영상이 없습니다.</div>`;
      $('more').hidden = true;
      return;
    }
    const max = Math.max(...rows.map(r => r.vph), 1);
    $('list').innerHTML = rows.slice(0, state.limit).map((v, i) => {
      const url = v.kind === 'short' ? `https://www.youtube.com/shorts/${v.id}` : `https://www.youtube.com/watch?v=${v.id}`;
      const badges = [
        `<span class="badge ${esc(v.channel)}">${esc(chName[v.channel] || v.channel)}</span>`,
        `<span class="badge">${KIND[v.kind] || esc(v.kind)}</span>`,
        v.live_now ? '<span class="badge live">LIVE</span>' : '',
        v.politics && v.topic ? `<span class="badge topic">${esc(v.topic)}</span>` : '',
        v.politics ? '' : '<span class="badge no">국내정치 아님</span>',
      ].join('');
      return `<article class="row${v.politics ? '' : ' off'}">
        <div class="rank num">${i + 1}</div>
        <a class="thumb" href="${url}" target="_blank" rel="noopener">
          <img loading="lazy" src="https://i.ytimg.com/vi/${esc(v.id)}/mqdefault.jpg" alt="">
          ${dur(v.duration) && !v.live_now ? `<span class="dur num">${dur(v.duration)}</span>` : ''}
        </a>
        <div class="body">
          <div class="badges">${badges}</div>
          <a class="title" href="${url}" target="_blank" rel="noopener">${esc(v.title)}</a>
          <div class="meta num">업로드 ${esc(ago(v.age_h))} · ${stamp(v.published)}</div>
        </div>
        <div class="rate">
          <div><span class="v num">${fmt(v.vph)}</span><span class="u">회/시간</span></div>
          <div class="meter"><i style="width:${Math.max(3, v.vph / max * 100).toFixed(1)}%"></i></div>
          <div class="total num">총 ${short(v.views)}회</div>
        </div>
      </article>`;
    }).join('');
    const left = rows.length - state.limit;
    $('more').hidden = left <= 0;
    $('more-btn').textContent = `더 보기 (${fmt(Math.min(PAGE, left))}개 더 · 남은 ${fmt(left)}개)`;
  }

  update();

  try {
    const y = sessionStorage.getItem(SCROLL);
    if (y) { scrollTo(0, Number(y)); sessionStorage.removeItem(SCROLL); }
  } catch (e) {}

  // radar.py 가 매시 정각에 radar.html 을 새로 쓰므로, 열어 둔 페이지는 10분마다 다시 읽는다
  setInterval(() => {
    if (document.activeElement === $('f-q')) return;  // 검색어 입력 중이면 다음 차례로 미룬다
    try { sessionStorage.setItem(SCROLL, String(scrollY)); } catch (e) {}
    location.reload();
  }, 10 * 60 * 1000);

  $('foot').innerHTML = [
    `시간당 조회수 = 수집 시점 조회수 ÷ 업로드 후 경과 시간 (${D.min_age_hours}시간 미만은 ${D.min_age_hours}시간으로 계산). 라이브는 방송 시작 시각 기준.`,
    `${D.source === 'api' ? `${D.window_hours}시간 내 업로드 ${fmt(D.listed)}개 확인 (YouTube Data API ${fmt(D.api_units)}유닛)` : `채널 목록 ${fmt(D.listed)}개 중 ${fmt(D.checked)}개 상세 확인 (웹페이지 수집)`} · 국내정치 판정: ${esc(D.classifier)}${D.error_count ? ` · 수집 오류 ${fmt(D.error_count)}건` : ''}`,
    `매시 정각 자동 수집 · 열어 둔 페이지는 10분마다 새로 읽음 · 수동 갱신: <code>python3 radar.py --open</code>`,
  ].join('<br>');
})();
</script>
</body>
</html>
